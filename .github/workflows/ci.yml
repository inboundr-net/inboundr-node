name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The matrix is the point, not ceremony. This package claims to run on any
      # runtime with `fetch` and `crypto.subtle` and it has no dependencies to
      # paper over a gap, so the floor named in `engines` has to be tested
      # rather than assumed. Node 20 is the oldest version we promise (18 has no
      # global crypto, which verification needs); drop it
      # here and from `engines` in the same commit, never just one.
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` against the committed lockfile: CI that resolves fresh on every
      # run can pass against a dependency tree no developer has. Dev-only — the
      # published package still has no dependencies.
      - run: npm ci --no-audit --no-fund
      # Includes spec:check, so a hand-edited src/generated/api.ts, or a spec
      # copied in without regenerating, fails here.
      - run: npm test

  publish:
    # Tags only, and only after the whole matrix is green.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: GitHub issues an OIDC token that npm accepts
      # for this repo and this workflow file (ci.yml), so no NPM_TOKEN secret
      # exists to leak. The same token signs the provenance statement npm
      # adds automatically for a public repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+; staging
          # needs npm 11.15+.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@^11.15.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund

      # Guard against the mismatch that is only discoverable after the fact:
      # npm publishes whatever `version` says, ignoring the tag entirely, so
      # tagging v0.2.0 with 0.1.0 in package.json silently republishes nothing
      # useful and burns the tag.
      - name: Tag must match package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Staged, not live: the version waits on npmjs.com (Staged Packages) until
      # a maintainer approves it with 2FA. CI can submit a release but never
      # ship one on its own.
      - run: npm stage publish --access public
